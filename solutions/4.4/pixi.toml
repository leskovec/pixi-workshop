# Step 4.4: dependencies and tasks split into features, three environments.
# From grayscott/: cp ../solutions/4.4/pixi.toml .

[workspace]
name = "grayscott"
version = "0.1.0"
channels = ["conda-forge"]
# Step 4.6 adds the other platforms. They are listed here already, so this
# file works on any machine.
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

# Needed in every environment: the code is an MPI program.
# Block 6 looks at the MPI choice in detail.
[dependencies]
openmpi = ">=5.0,<6"

# Compilers and build tools, only for development.
[feature.build.dependencies]
cxx-compiler = "*"
cmake = ">=3.20"
ninja = "*"

[feature.build.tasks]
configure = { cmd = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release", inputs = ["CMakeLists.txt"], outputs = ["build/CMakeCache.txt"] }
build = { cmd = "cmake --build build", depends-on = ["configure"], description = "Compile the solver" }
run = { cmd = "mpirun --oversubscribe -n {{ ranks }} build/grayscott --size {{ size }} --steps {{ steps }}", args = [{ arg = "ranks", default = "2" }, { arg = "size", default = "256" }, { arg = "steps", default = "10000" }], depends-on = ["build"], description = "Run the solver: pixi run run [ranks] [size] [steps]" }

# Plotting.
[feature.analysis.dependencies]
python = "3.13.*"
numpy = ">=2"
matplotlib-base = "*"

[feature.analysis.tasks]
plot = { cmd = "python scripts/plot.py output/v.npy", description = "Plot output/v.npy to output/v.png" }

[environments]
# `pixi run ...` uses the default environment: everything for development.
default = { features = ["build", "analysis"], solve-group = "main" }
analysis = { features = ["analysis"], solve-group = "main" }
# Only the runtime. Block 7 adds the packaged solver here.
prod = { features = [], solve-group = "main" }
